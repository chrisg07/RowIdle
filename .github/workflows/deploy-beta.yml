name: Deploy to itch.io (beta)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2

      - name: Push to itch.io (beta)
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          butler push dist criscotheshiz/rowidle-beta:html5 --userversion "beta-${SHORT_SHA}"
